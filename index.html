<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuyHaat</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-left">
      <button id="menuBtn" class="icon-btn" aria-label="Open Menu">☰</button>
      <h1 class="logo" onclick="go('home')">BuyHaat</h1>
    </div>
    <div class="header-right">
      <button id="headerSearchBtn" class="icon-btn" aria-label="Search">🔍</button>
    </div>
  </header>

  <!-- Side Menu & Overlay -->
  <div id="menuOverlay" class="menu-overlay"></div>
  <aside id="sideMenu" class="side-menu" aria-hidden="true">
    <div class="menu-header">
      <h2>Menu</h2>
      <button id="closeMenuBtn" class="icon-btn">&times;</button>
    </div>
    <div class="menu-content">
      <div id="accountStatus"></div>
      <nav class="menu-nav">
        <button id="loginBtn" class="primary w-100">Login</button>
        <button id="createStoreBtn" class="secondary w-100 hidden">Create Store</button>
        <button id="logoutBtn" class="danger w-100 hidden">Logout</button>
      </nav>
    </div>
  </aside>

  <!-- Main Content Container -->
  <main class="main-container">

    <!-- HOME PAGE -->
    <section id="home" class="page active-page">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search products or @store...">
        <button id="searchBtn" class="primary">Search</button>
      </div>

      <div id="categories" class="category-list"></div>

      <div class="section-title">
        <span id="productCount">0 products</span>
      </div>

      <div id="products" class="product-grid"></div>
    </section>

    <!-- FOLLOWING PAGE -->
    <section id="following" class="page">
      <h2>Followed Stores</h2>
      <div id="followingList" class="store-list"></div>
    </section>

    <!-- ADD PRODUCT PAGE -->
    <section id="add-product" class="page">
      <h2>Add New Product</h2>
      <div id="addNotice"></div>
      
      <form id="productForm" class="card-form">
        <label>
          Product Name
          <input type="text" id="productName" required placeholder="Product title">
        </label>
        
        <label>
          Price (৳)
          <input type="number" id="productPrice" min="0" step="any" required placeholder="0.00">
        </label>

        <label>
          Stock Quantity
          <input type="number" id="productStock" min="0" value="1" required placeholder="1">
        </label>

        <label>
          Category
          <select id="productCategory" required></select>
        </label>

        <label>
          Description
          <textarea id="productDescription" rows="3" placeholder="Product details..."></textarea>
        </label>

        <label>
          Product Image
          <input type="file" id="productImageFile" accept="image/*">
        </label>

        <button type="submit" class="primary w-100">Add Product</button>
        <p id="productMsg" class="form-msg"></p>
      </form>
    </section>

    <!-- MY STORE PAGE -->
    <section id="my-store" class="page">
      <div id="myStoreContent"></div>

      <div id="storeManagerCard" class="card hidden">
        <div class="tabs">
          <button class="tab active" data-tab="products">Products</button>
          <button class="tab" data-tab="orders">Orders</button>
          <button class="tab" data-tab="settings">Settings</button>
        </div>

        <div id="sellerProductsTab" class="tab-content"></div>
        <div id="sellerOrdersTab" class="tab-content hidden"></div>
        <div id="sellerSettingsTab" class="tab-content hidden"></div>
      </div>
    </section>

    <!-- PRODUCT DETAIL PAGE -->
    <section id="product-detail" class="page">
      <div id="productDetailContent"></div>
    </section>

    <!-- CHAT PAGE (Placeholder for route) -->
    <section id="chat" class="page">
      <h2>Chat</h2>
      <div class="empty">Chat feature coming soon...</div>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom">
    <button data-route="home" class="active">
      <span class="nav-icon">🏠</span>
      <span>Home</span>
    </button>
    <button data-route="following">
      <span class="nav-icon">❤️</span>
      <span>Following</span>
    </button>
    <button data-route="add-product">
      <span class="nav-icon">➕</span>
      <span>Add</span>
    </button>
    <button data-route="chat">
      <span class="nav-icon">💬</span>
      <span>Chat</span>
    </button>
    <button data-route="my-store">
      <span class="nav-icon">🏪</span>
      <span>My Store</span>
    </button>
  </nav>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- AUTH MODAL -->
  <div id="authModal" class="modal hidden">
    <div class="shade"></div>
    <div class="modal-card">
      <button id="closeAuthBtn" class="close-btn">&times;</button>
      <h2 id="authTitle">Login</h2>
      <p id="authSubtitle" class="store-meta"></p>
      
      <form id="authForm" class="card-form">
        <label>
          Email
          <input type="email" id="authEmail" required placeholder="example@mail.com">
        </label>
        <label>
          Password
          <input type="password" id="authPassword" required placeholder="******">
        </label>

        <button type="submit" id="authSubmitBtn" class="primary w-100">Login</button>
        <button type="button" id="authSwitchBtn" class="secondary w-100">Create New Account</button>
        <p id="authMessage" class="form-msg"></p>
      </form>
    </div>
  </div>

  <!-- CREATE STORE MODAL -->
  <div id="storeModal" class="modal hidden">
    <div class="shade"></div>
    <div class="modal-card">
      <button id="closeStoreBtn" class="close-btn">&times;</button>
      <h2>Create Store</h2>
      
      <form id="storeForm" class="card-form">
        <label>
          Store Name *
          <input type="text" id="storeName" required placeholder="My Awesome Store">
        </label>
        <label>
          Description
          <textarea id="storeDescription" rows="2"></textarea>
        </label>
        <label>
          Phone Number
          <input type="text" id="storePhone" placeholder="01700000000">
        </label>
        <label>
          Address
          <input type="text" id="storeAddress" placeholder="City, Country">
        </label>
        <label>
          Store Logo
          <input type="file" id="storeLogoFile" accept="image/*">
        </label>
        <label>
          Store Cover
          <input type="file" id="storeCoverFile" accept="image/*">
        </label>

        <button type="submit" class="primary w-100">Create Store</button>
        <p id="storeMessage" class="form-msg"></p>
      </form>
    </div>
  </div>

  <!-- EDIT PRODUCT MODAL -->
  <div id="productEditModal" class="modal hidden">
    <div class="shade"></div>
    <div class="modal-card">
      <button id="closeProductEditBtn" class="close-btn">&times;</button>
      <h2>Edit Product</h2>
      
      <form id="productEditForm" class="card-form">
        <input type="hidden" id="editProductId">
        
        <label>
          Product Name
          <input type="text" id="editProductName" required>
        </label>
        <label>
          Price (৳)
          <input type="number" id="editProductPrice" min="0" step="any" required>
        </label>
        <label>
          Stock Quantity
          <input type="number" id="editProductStock" min="0" required>
        </label>
        <label>
          Category
          <select id="editProductCategory" required></select>
        </label>
        <label>
          Description
          <textarea id="editProductDescription" rows="3"></textarea>
        </label>
        <label>
          Change Image
          <input type="file" id="editProductImageFile" accept="image/*">
        </label>

        <button type="submit" class="primary w-100">Save Changes</button>
        <p id="editProductMessage" class="form-msg"></p>
      </form>
    </div>
  </div>

  <!-- Config & App Script -->
  <script>
    // Supabase Credentials Check
    window.SUPABASE_URL = "YOUR_SUPABASE_URL";
    window.SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    if (window.supabase) {
      window.supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
